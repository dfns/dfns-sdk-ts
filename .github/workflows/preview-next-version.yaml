name: preview-next-version

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: npm-publish
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install packages
        run: |
          npm config set ignore-scripts true
          npm ci --prefer-offline --no-audit --cache .npm

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PK }}

      - name: Preview release version
        uses: cycjimmy/semantic-release-action@1989a0fefc4aea321e07f717680ed8e345925dc1 # v7.1.2
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Report next version
        run: |
          if [ -n "${NEXT_RELEASE_VERSION:-}" ]; then
            echo "### Next release version — \`$NEXT_RELEASE_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release will be published" >> "$GITHUB_STEP_SUMMARY"
          fi
